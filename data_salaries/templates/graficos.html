{% extends "master.html" %}


{% block content %}

<div class="container">
  <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2 text-white" style="margin-top: 7px">Graficos</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
      <div class="btn-group me-2">
      </div>
    </div>
  </div>
</div>

<div class="container-fluid mt-2 d-flex flex-column align-items-center" style="margin: 20px auto;">
  <div class="row justify-content-center">
      <div class="col-md">
          <img class="m-1 mt-5 img-fluid" style="border-radius: 5%;" data-aos="fade-up" data-aos-duration="3000" src="data:image/png;base64,{{ sal_hist }}" alt="Distribución de Salarios">
      </div>
      <div class="col-md ">
          <img class="m-1 mt-5 img-fluid" style="border-radius: 5%;" data-aos="fade-up" data-aos-duration="3000" src="data:image/png;base64,{{ el_scat }}" alt="Salario vs. Experiencia">
      </div>
  </div>
  <div class="row justify-content-center">
      <div class="col-md" >
          <img class="m-1 mt-5 img-fluid" style="border-radius: 5%;" data-aos="fade-up" data-aos-duration="3000" src="data:image/png;base64,{{ et_bars }}" alt="Salarios por Tipo de Empleo">
      </div>
      <div class="col-md">
        <img class="m-1 mt-5 img-fluid" style="border-radius: 5%; " data-aos="fade-up" data-aos-duration="3000" src="data:image/png;base64,{{ rr_bars }}" alt="Ratio de Trabajo Remoto vs. Salario">
      </div>
  </div>
  <div class="row justify-content-center ">
      <div class="col-md "  >
        <img class="m-1 mt-5 img-fluid " style="border-radius: 5%;" data-aos="fade-up" data-aos-duration="3000" src="data:image/png;base64,{{ cs_box }}" alt="Salarios por Tamaño de la Empresa">
      </div>
  </div>
</div>



{% endblock %}
